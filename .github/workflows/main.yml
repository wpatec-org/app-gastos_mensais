name: Build, Push to Docker Hub, and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}  # permite rodar manualmente

# Evita corrida de execuções de deploy
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx (melhor cache/push)
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          set -euxo pipefail
          COMMIT_SHA=$(git rev-parse --short HEAD)
          docker buildx build \
            --push \
            -t cloudwpa22/app-gastos_mensais:latest \
            -t cloudwpa22/app-gastos_mensais:git-$COMMIT_SHA \
            .

  deploy-to-vm:
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64]   # ✅ casa com as labels do seu runner
    timeout-minutes: 15
    env:
      COMPOSE_FILE: /opt/app-gastos_mensais/docker-compose.yml
      SERVICE_NAME: flask-app
      CONTAINER_NAME: app-gastos_mensais
    steps:
      - name: Pre-flight (diagnóstico rápido)
        run: |
          set -x
          whoami
          date
          uname -a
          df -h | sed -n '1,10p'
          docker version
          docker compose version || docker-compose version || true
          command -v docker || true
          command -v docker-compose || true
          id
          docker info | sed -n '1,60p'
          test -f "$COMPOSE_FILE" && echo "Compose encontrado em $COMPOSE_FILE" || (echo "Compose NÃO encontrado!" && exit 1)

      - name: Pull and Update Containers
        run: |
          set -euxo pipefail

          # Use docker compose v2 se existir; senão, fallback para v1
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose -f $COMPOSE_FILE"
          else
            DC="docker-compose -f $COMPOSE_FILE"
          fi

          # Puxa sempre a última imagem do serviço (ok se for 1ª vez)
          $DC pull $SERVICE_NAME --quiet || true

          # Sobe/atualiza apenas o serviço alvo, sem rebuild
          $DC up -d --pull always --no-build $SERVICE_NAME

          # Mostra estado
          $DC ps

      - name: Show app logs (últimas 120 linhas)
        if: always()
        run: |
          set -x
          docker logs --tail 120 "$CONTAINER_NAME" || true

      # Limpeza leve e segura (evite --all que é lento)
      - name: Cleanup lightweight (opcional)
        run: |
          docker image prune -f --filter "until=168h" || true
          docker builder prune -f --keep-storage 2GB || true