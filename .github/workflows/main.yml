name: Build, Push to Docker Hub, and Deploy

# Dispara o workflow quando houver push na branch main ou manualmente
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Evita que múltiplos deploys simultâneos da mesma branch rodem ao mesmo tempo
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas necessárias para este workflow
permissions:
  contents: read

# Centraliza o nome da imagem para evitar repetição
env:
  DOCKERHUB_IMAGE: cloudwpa22/app-gastos_mensais
jobs:
  # Etapa 1: Build e Push da imagem para o Docker Hub
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Buildx (melhor cache/push)
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        run: |
          set -euxo pipefail
          COMMIT_SHA=$(git rev-parse --short HEAD)
          docker buildx build \
            --push \
            -t $DOCKERHUB_IMAGE:latest \
            -t $DOCKERHUB_IMAGE:git-$COMMIT_SHA \
            .

  # Etapa 2: Deploy na VM usando runner self-hosted
  deploy-to-vm:
    name: Deploy to VM (Self-hosted)
    needs: build-and-push
    runs-on: [self-hosted, dockerdebian12]  # Label do runner na sua VM
    timeout-minutes: 15
    env:
      SERVICE_NAME: flask-app
      CONTAINER_NAME: app-gastos_mensais
    steps:
      - name: Diagnóstico rápido (Pre-flight)
        run: |
          set -x
          whoami
          date
          uname -a
          df -h | sed -n '1,10p'
          docker version
          docker compose version || docker-compose version || true
          command -v docker || true
          command -v docker-compose || true
          id
          docker info | sed -n '1,60p'

      # Checkout do repositório diretamente na VM
      - name: Checkout do repositório na VM
        uses: actions/checkout@v4

      # Deploy usando o compose do repositório
      - name: Deploy usando compose do repo
        run: |
          set -euxo pipefail

          # Detecta se está usando docker compose v2 ou v1
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose -f ./docker-compose.yml"
          else
            DC="docker-compose -f ./docker-compose.yml"
          fi

          # Puxa a imagem mais recente do serviço
          $DC pull $SERVICE_NAME --quiet || true

          # Sobe o serviço sem rebuild, sempre puxando a imagem
          $DC up -d --pull always --no-build $SERVICE_NAME

          # Mostra o estado atual dos containers
          $DC ps

      # Logs da aplicação (últimas 120 linhas)
      - name: Show app logs (últimas 120 linhas)
        if: always()
        run: |
          set -x
          docker logs --tail 120 "$CONTAINER_NAME" || true

      # Limpeza leve de imagens antigas e cache
      - name: Cleanup leve (opcional)
        run: |
          docker image prune -f --filter "until=168h" || true
          docker builder prune -f --keep-storage 2GB || true
