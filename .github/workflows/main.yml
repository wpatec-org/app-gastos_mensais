name: Build, Push to Docker Hub, and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}  # permite disparar manualmente pelo GitHub

# Evita que múltiplos deploys da mesma branch rodem ao mesmo tempo
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas necessárias para este workflow
permissions:
  contents: read

env:
  # Centraliza o nome da imagem para evitar repetição
  DOCKERHUB_IMAGE: cloudwpa22/app-gastos_mensais

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildx habilita o BuildKit + push direto e prepara cache
      - name: Set up Buildx (melhor cache/push)
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          set -euxo pipefail
          COMMIT_SHA=$(git rev-parse --short HEAD)
          docker buildx build \
            --push \
            -t $DOCKERHUB_IMAGE:latest \
            -t $DOCKERHUB_IMAGE:git-$COMMIT_SHA \
            .

  deploy-to-vm:
    name: Deploy to VM (Self-hosted)
    needs: build-and-push
    runs-on: [self-hosted, dockerdebian12]   # label exclusivo do seu runner
    timeout-minutes: 15
    env:
      COMPOSE_FILE: /opt/app-gastos_mensais/docker-compose.yml
      SERVICE_NAME: flask-app
      CONTAINER_NAME: app-gastos_mensais
    steps:
      # Diagnóstico rápido para dar visibilidade se algo der errado
      - name: Pre-flight (diagnóstico rápido)
        run: |
          set -x
          whoami
          date
          uname -a
          df -h | sed -n '1,10p'
          docker version
          docker compose version || docker-compose version || true
          command -v docker || true
          command -v docker-compose || true
          id
          docker info | sed -n '1,60p'
          test -f "$COMPOSE_FILE" && echo "Compose encontrado em $COMPOSE_FILE" || (echo "Compose NÃO encontrado!" && exit 1)

      - name: Pull and Update Containers
        run: |
          set -euxo pipefail

          # Usa docker compose (plugin v2) se existir; senão, docker-compose (v1)
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose -f $COMPOSE_FILE"
          else
            DC="docker-compose -f $COMPOSE_FILE"
          fi

          # Puxa sempre a última imagem do serviço (ok mesmo se for 1ª vez)
          $DC pull $SERVICE_NAME --quiet || true

          # Sobe/atualiza sem rebuild, sempre puxando a imagem
          $DC up -d --pull always --no-build $SERVICE_NAME

          # Mostra estado atual
          $DC ps

      - name: Show app logs (últimas 120 linhas)
        if: always()
        run: |
          set -x
          docker logs --tail 120 "$CONTAINER_NAME" || true

      # Limpeza leve e segura (evite --all, que é lento e apaga demais)
      - name: Cleanup lightweight (opcional)
        run: |
          docker image prune -f --filter "until=168h" || true
          docker builder prune -f --keep-storage 2GB || true
